<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="stylesheet" href="./app.css" type="text/css" media="screen" title="no title" charset="utf-8">
    <title>Profile Card</title>
  </head>
  <body>
    <article data-testid="test-profile-card" class="profile-card">

      <h2><div data-testid="test-user-name" class="user-name">Onyedikachi Awaji</div>
      </h2>
      <p><div data-testid="test-user-bio" class="user-bio">A programmer, cartographer, and applications analyst. Six years working in the oil and gas industry.</div>
      </p>
      <div data-testid="test-user-time" class="user-time">User-time</div>
      <figure>
          <img data-testid="test-user-avatar" class="user-avatar" src="path/to/avatar.jpg" alt="User Avatar">
          <figcaption>User-Avatar</figcaption>
          </figure>
      <nav data-testid="test-user-social-links" class="user-social-links">
        <div data-testid="test-user-social-facebook" class="user-social-facebook">Facebook social</div>
        <div data-testid="test-user-social-instagram" class="user-social-insta">Social insta</div>
        <div data-testid="test-user-social-twitter" class="user-social-twitter">Social Twitter</div>
      </nav>
      <section>
        <div data-testid="test-user-hobbies" class="user-hobbies">User hobbies
          <ul>
            <li>Hobby 1</li>
            <li>Hobby 2</li>
            <li>Hobby 3</li>
          </ul>
        </div>

        <div data-testid="test-user-dislikes" class="user-dislikes">User dislikes
          <ul>
            <li>Dislike 1</li>
            <li>Dislike 2</li>
            <li>Dislike 3</li>
          </ul>
          </div>
      </section>
    </article>

  <!-- 


    --!>
  </body>
</html>
